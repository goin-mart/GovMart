
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOIN MART - Member Registration</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;font-family:Arial,sans-serif;background:#f0f6ef;color:#173b2b}
header{text-align:center;background:#13783f;color:white;padding:24px 12px;border-radius:14px;margin-bottom:20px}
header h1{margin:0 0 8px}
.card{max-width:480px;margin:auto;padding:22px;background:white;border-radius:16px;box-shadow:0 4px 18px #0001}
label{display:block;font-weight:bold;margin:15px 0 6px}
input{width:100%;padding:13px;border:1px solid #cbd8cf;border-radius:9px;font-size:16px}
input[readonly]{background:#f1f5f2}
button{width:100%;padding:14px;margin-top:22px;border:0;border-radius:9px;background:#13783f;color:white;font-size:17px;font-weight:bold}
.note{font-size:13px;line-height:1.6;color:#53665a}
.status{padding:12px;background:#e6f4ea;border-radius:9px;margin-top:15px}
a{color:#13783f}
</style>
</head>
<body>
<header>
<h1>GOIN MART</h1>
<div>Shop Smart. Save More.</div>
</header>

<div class="card">
<h2>Member Registration</h2>
<p class="note">Register using your member's referral link.</p>

<div class="status" id="placementInfo">
Checking referral link...
</div>

<form id="registerForm">
<label for="fullName">Full Name</label>
<input id="fullName" autocomplete="name" required>

<label for="mobile">Mobile Number</label>
<input id="mobile" type="tel" inputmode="numeric"
pattern="[0-9]{10}" maxlength="10" required>

<label for="username">Username</label>
<input id="username" minlength="4" maxlength="30"
pattern="[A-Za-z0-9_]+" autocomplete="username" required>

<label for="email">Email Address</label>
<input id="email" type="email" autocomplete="email" required>

<label for="referralCode">Referral Code</label>
<input id="referralCode" readonly required>

<label for="placement">Binary Placement</label>
<input id="placement" readonly required>

<label for="password">Password</label>
<input id="password" type="password" minlength="10"
autocomplete="new-password" required>

<p class="note">
Your account will start as INACTIVE. Referral details and placement
must be verified by the server before registration is completed.
</p>

<button type="submit">Register</button>
<p class="note" id="message" role="status"></p>
</form>

<p class="note">Already registered? <a href="login.html">Login here</a></p>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const ref = (params.get("ref") || "").trim();
const side = (params.get("side") || "").toLowerCase();

const codeInput = document.getElementById("referralCode");
const sideInput = document.getElementById("placement");
const info = document.getElementById("placementInfo");
const message = document.getElementById("message");

if (ref && ["left", "right"].includes(side)) {
  codeInput.value = ref;
  sideInput.value = side.toUpperCase();
  info.textContent =
    "Referral Code: " + ref + " | Placement: " + side.toUpperCase() +
    ". Referrer verification pending.";
} else {
  info.textContent =
    "Please open a valid Left or Right referral link to continue.";
  document.getElementById("registerForm").querySelector("button").disabled = true;
}

document.getElementById("registerForm").addEventListener("submit", function(e) {
  e.preventDefault();
  message.textContent =
    "Registration service is not connected yet. No account has been created.";
});
</script>
</body>
</html>
