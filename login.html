<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOV MART - Member Login</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:18px;font-family:Arial,sans-serif;background:#f0f4fa;color:#172b46}header{text-align:center;background:#173b62;color:#fff;padding:24px 12px;border-radius:14px;margin-bottom:20px}header h1{margin:0 0 8px;font-size:clamp(30px,8vw,44px)}.card{max-width:480px;margin:auto;padding:22px;background:#fff;border:1px solid #dce5ef;border-radius:16px;box-shadow:0 4px 18px #0001}label{display:block;font-weight:bold;margin:18px 0 6px}input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px;color:#172b46}button{width:100%;padding:15px;margin-top:22px;border:0;border-radius:9px;background:#173b62;color:#fff;font-size:18px;font-weight:bold}button:disabled{opacity:.6}.note{font-size:14px;line-height:1.6;color:#536579}#message{overflow-wrap:anywhere}a{color:#173b62}
</style>
</head>
<body>
<header><h1>GOV MART</h1><div>Shop Smart. Save More.</div></header>
<div class="card">
<h2>Member Login</h2>
<p class="note">Sign in using your username and password.</p>
<form id="loginForm">
<label for="identifier">Username</label>
<input id="identifier" type="text" autocomplete="username" minlength="1" maxlength="30" placeholder="Enter your username" required>
<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password" required>
<button id="loginBtn" type="submit">Login</button>
<p class="note" id="message" role="status" aria-live="polite"></p>
</form>
<p class="note">New member? <a href="register.html">Register here</a></p>
<p class="note"><a href="index.html">Back to Home</a></p>
</div>
<script src="config.js"></script>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const cfg=window.GOV_MART_CONFIG;
const form=document.getElementById('loginForm');
const btn=document.getElementById('loginBtn');
const message=document.getElementById('message');
if(!cfg?.supabaseUrl||!cfg?.supabaseKey){message.textContent='Login setup is incomplete. Please contact GOV MART support.';btn.disabled=true;}
else{
 const supabase=createClient(cfg.supabaseUrl,cfg.supabaseKey);
 form.addEventListener('submit',async(event)=>{
  event.preventDefault();message.textContent='';btn.disabled=true;btn.textContent='Signing in...';
  try{
   const identifier=document.getElementById('identifier').value.trim();
   const password=document.getElementById('password').value;
   if(!identifier||!password)throw new Error('Enter your email/username and password.');
   const response=await fetch(`${cfg.supabaseUrl}/functions/v1/gov-mart-username-login`,{
    method:'POST',headers:{'Content-Type':'application/json','apikey':cfg.supabaseKey,'Authorization':`Bearer ${cfg.supabaseKey}`},
    body:JSON.stringify({username:identifier.toLowerCase(),password})
   });
   const result=await response.json().catch(()=>({}));
   if(!response.ok)throw new Error(result.error||'Username or password is incorrect.');
   if(!result.session)throw new Error('Login service did not return a session. Please contact GOV MART support.');
   const {error}=await supabase.auth.setSession(result.session);
   if(error)throw error;
   const {data:{user},error:userError}=await supabase.auth.getUser();
   if(userError)throw userError;
   const {data:profile,error:profileError}=await supabase.from('gov_mart_members').select('full_name,username,account_status').eq('id',user.id).maybeSingle();
   if(profileError)throw profileError;
   if(!profile)throw new Error('Your GOV MART member profile was not found. Please contact support.');
   // Route authorized administrators to admin.html; normal members go to user.html.
   const {data:adminRecord,error:adminError}=await supabase.from('gov_mart_admins').select('user_id').eq('user_id',user.id).maybeSingle();
   if(adminError)throw new Error('Login succeeded, but admin access could not be checked: '+adminError.message);
   message.textContent=adminRecord?'Admin login successful. Opening Admin Panel...':'Login successful. Opening your dashboard...';
   window.location.replace(adminRecord?'admin.html':'user.html');
  }catch(error){
   const raw=error?.message||'Unknown login error.';
   if(/invalid login credentials|invalid email or password|user not found|invalid username or password/i.test(raw))message.textContent='Username or password is incorrect. Please check and try again.';
   else if(/email not confirmed/i.test(raw))message.textContent='Email confirmation is required. Please contact GOV MART support.';
   else message.textContent=raw;
  }finally{btn.disabled=false;btn.textContent='Login';}
 });
}
</script>
</body>
</html>
