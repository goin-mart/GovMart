<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOIN MART</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f8f1;
      color: #173b25;
      text-align: center;
    }
    header {
      background: #137a3b;
      color: white;
      padding: 25px 10px;
    }
    h1 { margin: 0; font-size: 32px; }
    main { padding: 35px 18px; }
    .card {
      background: white;
      padding: 25px 15px;
      margin: 20px auto;
      max-width: 420px;
      border-radius: 14px;
      box-shadow: 0 3px 12px #00000012;
    }
    .btn {
      display: inline-block;
      background: #137a3b;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      margin-top: 12px;
    }
    footer { padding: 20px; color: #55705c; }
  </style>
</head>
<body>
  <header>
    <h1>GOIN MART</h1>
    <p>Shop Smart. Save More.</p>
  </header>
  <main>
    <div class="card">
      <h2>Welcome to GOIN MART</h2>
      <p>Your grocery shopping and membership platform.</p>
      <p>Easy shopping. Convenient service.</p>
    </div>
    <div class="card">
      <h2>Member Portal</h2>
      <p>Member registration and login will be connected in the next step.</p>
    </div>
  </main>
  <footer>© 2026 GOIN MART. All rights reserved.</footer>
</body>
</html>
